{% extends "base.html" %}
{% block title %}Career Detail — CareerAI{% endblock %}
{% block content %}
<div class="container py-5">

  <!-- Back -->
  <a href="/dashboard" class="btn btn-outline-secondary btn-sm mb-4">
    <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
  </a>

  <!-- Career header (loaded via JS) -->
  <div id="careerHeader" class="mb-5">
    <div class="skeleton-line w-50 mb-2" style="height:2rem;"></div>
    <div class="skeleton-line w-25"></div>
  </div>

  <div class="row g-4">

    <!-- ── LEFT: Skill Gap Radar + Table ─────────────────────────────── -->
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm h-100 p-4">
        <h5 class="fw-bold mb-1"><i class="bi bi-radar text-primary me-2"></i>Skill Gap Analysis</h5>
        <p class="text-muted small mb-3">Blue = Your Level &nbsp;|&nbsp; Red = Required Level</p>

        <!-- Summary badges -->
        <div class="d-flex gap-2 mb-3 flex-wrap" id="gapSummary"></div>

        <canvas id="radarChart" height="280"></canvas>

        <div class="mt-3" id="skillTable"></div>

        <div class="mt-4" id="resourceSection"></div>
      </div>
    </div>

    <!-- ── RIGHT: Career Path Timeline ──────────────────────────────── -->
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm h-100 p-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-signpost-2-fill text-success me-2"></i>Career Progression Path</h5>
        <div id="pathTimeline">
          <div class="text-center py-4"><div class="spinner-border text-success"></div></div>
        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const CAREER_ID = {{ career_id }};
let radarChart  = null;

document.addEventListener('DOMContentLoaded', async () => {
  await Promise.all([loadSkillGap(), loadCareerPath()]);
});

// ── Skill Gap ───────────────────────────────────────────────────────────────
async function loadSkillGap() {
  const res  = await fetch(`/api/skill-gap/${CAREER_ID}`);
  if (!res.ok) { showMsg('Could not load skill gap data.'); return; }
  const data = await res.json();

  // Header
  document.getElementById('careerHeader').innerHTML = `
    <h2 class="fw-bold">${data.career.career_name}</h2>
    <span class="badge bg-primary bg-opacity-10 text-primary fs-6">${data.career.domain}</span>
  `;

  // Summary badges
  const s = data.summary;
  document.getElementById('gapSummary').innerHTML = `
    <span class="badge bg-success"><i class="bi bi-check-circle-fill me-1"></i>${s.strengths} Strengths</span>
    <span class="badge bg-warning text-dark"><i class="bi bi-exclamation-triangle-fill me-1"></i>${s.minor_gaps} Minor Gaps</span>
    <span class="badge bg-danger"><i class="bi bi-x-circle-fill me-1"></i>${s.major_gaps} Major Gaps</span>
    <span class="badge bg-info text-dark">Readiness: ${s.readiness_pct}%</span>
  `;

  // Radar chart
  const ctx = document.getElementById('radarChart').getContext('2d');
  if (radarChart) radarChart.destroy();
  radarChart = new Chart(ctx, {
    type: 'radar',
    data: data.chart_data,
    options: {
      scales: { r: { min: 0, max: 5, ticks: { stepSize: 1 }, pointLabels: { font: { size: 11 } } } },
      plugins: { legend: { position: 'top' } },
      elements: { line: { borderWidth: 2 } }
    }
  });

  // Skill table
  let rows = '<table class="table table-sm table-hover small"><thead class="table-light"><tr>' +
    '<th>Skill</th><th class="text-center">Required</th><th class="text-center">Yours</th><th class="text-center">Gap</th></tr></thead><tbody>';
  for (const [skill, g] of Object.entries(data.gaps)) {
    const cls = g.status === 'strength' ? 'success' : g.status === 'minor_gap' ? 'warning' : 'danger';
    const dot = `<span class="badge bg-${cls} bg-opacity-15 text-${cls}">●</span>`;
    rows += `<tr><td>${skill}</td><td class="text-center">${g.required}/5</td><td class="text-center">${g.current}/5</td><td class="text-center">${dot} ${g.gap}</td></tr>`;
  }
  rows += '</tbody></table>';
  document.getElementById('skillTable').innerHTML = rows;

  // Resources
  if (data.resources && Object.keys(data.resources).length) {
    let rhtml = '<h6 class="fw-bold mt-2 mb-2"><i class="bi bi-book-fill text-warning me-1"></i>Learning Resources</h6><div class="list-group list-group-flush">';
    for (const [skill, resList] of Object.entries(data.resources)) {
      for (const r of resList) {
        rhtml += `<a href="${r.url||'#'}" target="_blank" class="list-group-item list-group-item-action px-0 py-2 border-0">
          <div class="fw-semibold small">${r.title}</div>
          <div class="text-muted" style="font-size:.78rem;">${r.provider||''} &nbsp;·&nbsp; <em>for: ${skill}</em></div>
        </a>`;
      }
    }
    rhtml += '</div>';
    document.getElementById('resourceSection').innerHTML = rhtml;
  }
}

// ── Career Path ─────────────────────────────────────────────────────────────
async function loadCareerPath() {
  const res  = await fetch(`/api/career-path/${CAREER_ID}`);
  if (!res.ok) { document.getElementById('pathTimeline').innerHTML = '<p class="text-muted">Path data unavailable.</p>'; return; }
  const data = await res.json();
  const icons= ['bi-briefcase','bi-briefcase-fill','bi-award-fill','bi-trophy-fill'];
  const cols = ['primary','success','warning','danger'];

  let html = '<div class="career-timeline">';
  data.progression.forEach((stage, i) => {
    html += `
      <div class="timeline-item d-flex gap-3 mb-4">
        <div class="timeline-icon bg-${cols[i%4]} text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:42px;height:42px;">
          <i class="bi ${icons[i%4]}"></i>
        </div>
        <div class="timeline-content border rounded-3 p-3 flex-fill">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-1 mb-1">
            <h6 class="fw-bold mb-0">${stage.title}</h6>
            <span class="badge bg-${cols[i%4]} bg-opacity-10 text-${cols[i%4]}">${stage.salary_range}</span>
          </div>
          <div class="text-muted small mb-2">
            <i class="bi bi-clock me-1"></i>${stage.experience} &nbsp;|&nbsp;
            <i class="bi bi-mortarboard me-1"></i>${stage.education}
          </div>
          <div class="d-flex flex-wrap gap-1 mb-2">
            ${stage.key_skills.map(s=>`<span class="badge bg-light text-dark border">${s}</span>`).join('')}
          </div>
          ${stage.certifications.length ? `<div class="text-muted" style="font-size:.78rem;"><i class="bi bi-patch-check-fill text-warning me-1"></i>${stage.certifications.join(' · ')}</div>` : ''}
        </div>
      </div>
      ${i < data.progression.length-1 ? '<div class="timeline-connector ms-5 border-start border-2 border-dashed" style="height:16px;"></div>' : ''}
    `;
  });
  html += '</div>';
  document.getElementById('pathTimeline').innerHTML = html;
}

function showMsg(msg) {
  document.getElementById('careerHeader').innerHTML = `<div class="alert alert-danger">${msg}</div>`;
}
</script>
{% endblock %}
